# ─────────────────────────────────────────────────────────────────────────────
# SituLab — CI de qualité (sur chaque push / pull request)
#
# Portes BLOQUANTES : format (gofmt), analyse (go vet), lint (golangci-lint),
# vulnérabilités des dépendances (govulncheck), et tests avec détecteur de
# courses (-race) sur une MATRICE 3 OS (Linux, Windows, macOS) + smoke CLI par OS
# (chemins, socket, invocation git, bindings fenêtre compilés partout).
#
# Toolchain : Go 1.27.3 (plancher = directive go.mod ; corrige GO-2026-6809 crypto/x509).
# ─────────────────────────────────────────────────────────────────────────────
name: ci

on:
  push: { branches: ["main", "work/**"] }
  pull_request: {}

env:
  GO_VERSION: "1.27.3"

jobs:
  # Analyse statique : une seule fois (Linux), toutes bloquantes.
  quality:
    runs-on: ubuntu-22.04 # GTK3/WebKit2GTK pour compiler les paquets qui touchent à Wails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}" }
      - name: Dépendances système (paquets liés à la fenêtre)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Format (gofmt) — BLOQUANT
        run: |
          out=$(gofmt -l . | grep -v '/wailsjs/' || true)
          if [ -n "$out" ]; then echo "Fichiers non formatés :"; echo "$out"; exit 1; fi

      - name: Analyse (go vet) — BLOQUANT
        run: go vet ./...

      - name: Lint (golangci-lint) — BLOQUANT
        uses: golangci/golangci-lint-action@v8
        with: { version: "latest" }

      - name: Vulnérabilités des dépendances (govulncheck) — BLOQUANT
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Tests + smoke : sur les trois systèmes supportés (chemins, socket AF_UNIX, git).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}" }
      - name: Dépendances système (Linux uniquement)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Tests (avec détecteur de courses) — BLOQUANT
        run: go test -race ./...

      - name: Smoke CLI — la commande se lance sur cet OS
        run: go run -tags "desktop,production" . version

  # Lint du frontend (scripts de la fenêtre).
  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - name: Lint (ESLint) — BLOQUANT
        run: npm run lint
