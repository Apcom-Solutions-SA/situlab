# ─────────────────────────────────────────────────────────────────────────────
# SituLab — CI de qualité (sur chaque push / pull request)
#
# Portes BLOQUANTES : format (gofmt), analyse (go vet), tests (avec -race).
# Portes INFORMATIVES au départ (continue-on-error) : govulncheck (vulnérabilités des
# dépendances) et golangci-lint. À rendre bloquantes une fois le 1er passage nettoyé.
#
# Toolchain : Go 1.25 (plancher = directive go.mod ; Wails v2 compile sans souci sous Go récent).
# ─────────────────────────────────────────────────────────────────────────────
name: ci

on:
  push: { branches: ["main", "work/**"] }
  pull_request: {}

env:
  GO_VERSION: "1.25"

jobs:
  quality:
    runs-on: ubuntu-22.04 # GTK3/WebKit2GTK pour compiler les paquets qui touchent à Wails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}" }

      - name: Dépendances système (pour compiler/tester les paquets liés à la fenêtre)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Format (gofmt) — BLOQUANT
        run: |
          out=$(gofmt -l . | grep -v '/wailsjs/' || true)
          if [ -n "$out" ]; then echo "Fichiers non formatés :"; echo "$out"; exit 1; fi

      - name: Analyse (go vet) — BLOQUANT
        run: go vet ./...

      - name: Tests (avec détecteur de courses) — BLOQUANT
        run: go test -race ./...

      - name: Vulnérabilités des dépendances (govulncheck) — informatif
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Lint (golangci-lint) — informatif
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with: { version: "latest" }
